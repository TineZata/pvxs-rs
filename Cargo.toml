[package]
name = "pvxs"
version = "0.2.0"
edition = "2021"
description = "High-level Rust bindings for EPICS PVXS (PVAccess) with separate Client and Server APIs"
license = "MIT OR Apache-2.0"
repository = "https://github.com/TineZata/pvxs-rs"

[dependencies]
epics-pvxs-sys = { git = "https://github.com/TineZata/epics-pvxs-sys", default-features = false, branch = "development" }
thiserror = "2.0.17"
serde = { version = "1.0", features = ["derive"], optional = true }
tokio = { version = "1.0", features = ["full"], optional = true }
tracing = "0.1"
futures = { version = "0.3", optional = true }

[dev-dependencies]
tokio-test = "0.4"
env_logger = "0.11.8"
fastrand = "2.3.0"

[features]
default = ["client"]
client = []
server = []
async = ["tokio", "futures", "epics-pvxs-sys/async"]
serde = ["dep:serde"]
full = ["client", "server", "async", "serde"]
